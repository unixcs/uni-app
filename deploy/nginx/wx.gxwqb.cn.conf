server {
    listen 80;
    listen [::]:80;
    server_name wx.gxwqb.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wx.gxwqb.cn;

    ssl_certificate /etc/letsencrypt/live/wx.gxwqb.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wx.gxwqb.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/yoshop/current/yoshop2.0/public;
    index index.html index.php index.htm;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location ~ (^|/)\.(?!well-known/) {
        deny all;
    }

    location ~* /(composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.env(\..*)?|\.git|README\.md|deploy|openspec)(/|$) {
        deny all;
    }

    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        access_log off;
        log_not_found off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?s=$uri&$query_string;
    }

    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location ^~ /store/ {
        try_files $uri $uri/ /store/index.html;
    }

    location ~ \.php$ {
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~* \.(?:bak|sql|log|ini|sh|gitignore)$ {
        deny all;
    }
}

