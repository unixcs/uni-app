server {
    listen 80;
    listen [::]:80;
    server_name wx.gxwqb.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wx.gxwqb.cn;
    ssl_certificate /etc/letsencrypt/live/wx.gxwqb.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wx.gxwqb.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/yoshop-maintenance;
    error_page 503 /index.html;
    location = /index.html { internal; }
    location / {
        add_header Retry-After 900 always;
        add_header Cache-Control "no-store" always;
        return 503;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name gxwqb.cn www.gxwqb.cn;
    root /mnt/vps/tencent/static-site;
    index index.html;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ (^|/)\. { deny all; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.gxwqb.cn;
    ssl_certificate /etc/letsencrypt/live/www.gxwqb.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.gxwqb.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /mnt/vps/tencent/static-site;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location ~ (^|/)\. { deny all; }
}
